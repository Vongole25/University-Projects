[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-ss"
version = "0.1.0"
description = "StereoSet topic-bias experiment bootstrap package"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "University-Projects" }]
dependencies = [
  "torch",
  "transformers",
  "accelerate",
  "datasets",
  "numpy",
  "pandas",
  "matplotlib",
  "scipy",
]

[project.scripts]
llm-ss = "llm_ss.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
